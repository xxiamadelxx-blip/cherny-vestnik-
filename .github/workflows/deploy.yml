name: Deploy Telegram bot on Cloudflare Free
# M4 acceptance deployment: publish the independently verified scheduled-cutoff fix.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'scripts/activate-cloudflare.mjs'
      - 'scripts/provision-d1.mjs'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_TRANSPORT: polling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify that the user has configured cloud credentials
        shell: bash
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN GROQ_API_KEY; do
            if [[ -z "${!key}" ]]; then echo "Missing Actions secret: $key"; exit 1; fi
          done
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm test
      - name: Verify Telegram, available Groq model and Cloudflare (no token-spending completion)
        env:
          PREFLIGHT_SKIP_COMPLETION: '1'
        run: node scripts/preflight.mjs
      - name: Reuse or create Cloudflare D1 automatically
        run: node scripts/provision-d1.mjs
      - name: Apply D1 schema migration
        run: npx wrangler d1 migrations apply cherny-vestnik --remote
      - name: Deploy Worker and 15-minute Cron
        run: npx wrangler deploy
      - name: Activate DNS-independent Telegram getUpdates polling (preserve backlog)
        run: node scripts/activate-cloudflare.mjs
