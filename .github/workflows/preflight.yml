name: Preflight real Telegram Groq Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax and simulated tests
        run: npm run check && npm test
      - name: Verify Cloudflare Worker bundles without publishing
        run: |
          npm install --no-audit --no-fund
          node -e "const fs=require('node:fs'); const path='wrangler.jsonc'; const c=JSON.parse(fs.readFileSync(path)); c.d1_databases[0].database_id='00000000-0000-4000-8000-000000000001'; fs.writeFileSync(path, JSON.stringify(c));"
          npx wrangler deploy --dry-run --outdir .wrangler-preflight
      - name: Validate actual Telegram Groq and Cloudflare credentials
        run: node scripts/preflight.mjs